  <circle id="soccer" cx="12" cy="12" r="10"/>
  <path id="soccer-lines" d="M7 12h10M12 7v10M9.5 9.5l3 3M14.5 9.5l-3 3"/>
  
  <!-- Users Icon -->
  <g id="users">
